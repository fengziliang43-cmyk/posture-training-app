name: 功能建议 / Feature request
description: 提议一个可验证的产品或工程改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景和当前阻碍，不要提交真实病例或个人资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 尽量说明最小可行改动和如何验证。
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全、隐私或医学边界影响
      description: 如果没有明显影响，请填写“无”。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我确认内容中没有真实健康资料、体态照片、个人信息或凭证。
          required: true
